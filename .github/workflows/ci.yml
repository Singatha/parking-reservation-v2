name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: parking_reservation
          MYSQL_USER: parking_app
          MYSQL_PASSWORD: local-parking-password
          MYSQL_ROOT_PASSWORD: local-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -plocal-root-password"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare browser-test database
        env:
          NODE_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 3306
          DATABASE_NAME: parking_reservation
          DATABASE_USER: parking_app
          DATABASE_PASSWORD: local-parking-password
          SESSION_TTL_DAYS: 1
          COOKIE_SECURE: "false"
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Docker Compose
        run: docker compose config --quiet
